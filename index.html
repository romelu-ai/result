<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あなたへの回答｜クラス印象アンケート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--paper:#F6F1E6;--paper-line:#DCD2BB;--ink:#23282E;--ink-soft:#5B5647;--stamp:#B23A2E;--stamp-soft:#E9D9CE;--ok:#55684A;--mark:#DDE8CF}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.7;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:40px 20px 140px}
header.page-head{border-bottom:1px solid var(--paper-line);padding-bottom:20px;margin-bottom:32px}
h1{font-family:'Shippori Mincho',serif;font-weight:700;font-size:26px;margin:0 0 10px;letter-spacing:.02em}
.lead{color:var(--ink-soft);font-size:14.5px;margin:0}
.card{background:#fff;border:1px solid var(--paper-line);border-radius:2px;padding:26px 22px;margin-bottom:22px}
label{display:block;font-size:13.5px;font-weight:700;margin:18px 0 6px}
label:first-of-type{margin-top:0}
select,input[type=text]{width:100%;font-family:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--paper-line);border-radius:2px}
select{font-size:22px;font-weight:700;padding:12px 14px}
input[type=text]{font-size:20px;letter-spacing:.18em;text-transform:uppercase;padding:12px 14px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{font-family:inherit;font-size:15px;font-weight:700;color:#fff;background:var(--stamp);border:0;border-radius:2px;padding:13px 26px;margin-top:22px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.quiet{color:var(--ink-soft);background:transparent;border:1px solid var(--paper-line);margin-top:0}
.notice{display:none;margin-top:16px;padding:12px 14px;font-size:14px;color:var(--stamp);background:var(--stamp-soft);border-radius:2px}
.hint{margin:14px 0 0;font-size:12.5px;color:var(--ink-soft)}
.summary{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:22px}
.summary p{margin:0;font-family:'Shippori Mincho',serif;font-weight:700;font-size:20px}
.summary p b{color:var(--stamp);font-size:30px;margin:0 2px}
.answer-q{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:0 0 4px}
.answer-a{margin:0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:40px 0}
.answer-block{margin-top:20px;padding-left:10px;border-left:3px solid transparent}
.answer-block:first-child{margin-top:0}
.answer-block.adopted{border-left-color:var(--ok)}
mark{background:var(--mark);color:inherit;border-radius:2px;box-shadow:0 2px 0 var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;font-size:12.5px;background:var(--mark);border-radius:12px;padding:2px 4px 2px 10px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{margin:0;padding:0;width:22px;height:22px;font-size:14px;line-height:1;color:var(--ink-soft);background:transparent;border-radius:50%}
.caution{margin:0 0 18px;padding:14px 16px;font-size:13px;color:var(--ink-soft);background:#fff;border:1px solid var(--paper-line);border-left:3px solid var(--ink-soft);border-radius:2px}
.caution p{margin:0}
.caution p+p{margin-top:8px}
.caution b{color:var(--ink)}
#adopt-line{margin:-8px 0 18px}
#adopt-note{margin:0 0 18px}
#results{display:none}
#select-bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
#select-bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
#select-bar .txt{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#select-bar button{margin:0;padding:10px 16px;font-size:14px;white-space:nowrap}
.section-title{font-family:'Shippori Mincho',serif;font-weight:700;font-size:17px;margin:30px 0 12px}
.answer-block + .answer-block{padding-top:16px;border-top:1px dashed var(--paper-line)}
@media (prefers-reduced-motion:no-preference){#results .card{animation:rise .35s ease both}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <h1>あなたへの回答</h1>
    <p class="lead">あなたについて書かれた回答を読むことができます。誰が書いたかは表示されません。</p>
  </header>

  <div class="card" id="auth-card">
    <label for="own-number">あなたの出席番号</label>
    <select id="own-number"><option value="" disabled selected>選択してください</option></select>
    <label for="own-code">個別コード</label>
    <input type="text" id="own-code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12">
    <button type="button" id="show-button">回答を見る</button>
    <div class="notice" id="notice" role="alert"></div>
    <p class="hint">個別コードは1人ずつ渡されます。他の人に見せないでください。</p>
  </div>

  <div id="results">
    <div class="summary">
      <p id="count-line"></p>
      <button type="button" class="quiet" id="close-button">閉じる</button>
    </div>

    <div class="caution">
      <p>突然公開が終了する可能性がありますので、控えておきたい場合は各自の手段で保存をしてください。</p>
      <p>
        <b>クラスページに載せたい部分があれば、発言の文字をなぞって（スマホは長押しして）選択し、
        下に出る「この部分を採用」を押してください（任意）。</b>
        1つの発言の中から、一部だけを選ぶこともできます。
        <b>ただし、文字数の関係上、意見を反映できず、委員が独断でクラスページに載せる内容を決定する可能性が大いにあります。</b>
      </p>
    </div>

    <p class="hint" id="adopt-line"></p>
    <div class="notice" id="adopt-note" role="alert"></div>
    <div id="answer-list"></div>
  </div>
</div>

<div id="select-bar" role="region" aria-label="選択した部分">
  <div class="in">
    <span class="txt" id="bar-text"></span>
    <button type="button" id="bar-adopt">この部分を採用</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://tqvemvvimtsnrmohelnm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_TRfm7gxQ7Sdh_8CX85smDw_TG4akfdj";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* index.html の QUESTIONS と同じ内容にしてください */
const QUESTIONS = [
  { id:"impression", label:"この人の印象を教えてください" },
  { id:"goodpoint",  label:"良いところ・すごいと思うところ" },
  { id:"message",    label:"一言メッセージ" }
];

const MESSAGES = {
  not_released:"回答の公開はまだ始まっていません。公開されるまでお待ちください。",
  locked:"入力の失敗が続いたため、一時的に利用できません。15分ほど待ってからやり直してください。",
  invalid:"出席番号か個別コードが違います。もう一度確かめてください。",
  adoption_closed:"掲載希望の受付は締め切られました。",
  not_found:"この発言が見つかりませんでした。ページを開き直してください。",
  invalid_range:"選んだ範囲が正しくありません。もう一度選んでください。",
  too_many:"1つの発言で選べるのは10か所までです。",
  error:"読み込みに失敗しました。時間をおいて、もう一度お試しください。"
};

const ownNumber = document.getElementById("own-number");
const ownCode = document.getElementById("own-code");
const showButton = document.getElementById("show-button");
const notice = document.getElementById("notice");
const adoptNote = document.getElementById("adopt-note");
const bar = document.getElementById("select-bar");
const barText = document.getElementById("bar-text");
const barAdopt = document.getElementById("bar-adopt");

function showNotice(t){ notice.textContent = t; notice.style.display = "block"; }
function hideNotice(){ notice.style.display = "none"; }
function showAdoptNote(t){ adoptNote.textContent = t; adoptNote.style.display = "block"; }

async function loadNumbers(){
  const { data, error } = await supabaseClient.rpc("get_roster_numbers");
  if(error || !Array.isArray(data)){ showNotice(MESSAGES.error); return; }
  data.forEach(r => {
    const o = document.createElement("option");
    o.value = r.number;
    o.textContent = `${r.number}番`;
    ownNumber.appendChild(o);
  });
}

/* 本人確認に使った番号とコード。画面を閉じるまでメモリ上にだけ置く */
const session = { number:null, code:null, adoptionOpen:true };

/* 回答欄ごとの状態。要素 → { key, field, chars, ranges, ... } */
const ctxByEl = new Map();
let pending = null;   // いま選択中の範囲 { ctx, s, e }
let hideTimer = null;

function updateAdoptCount(){
  let n = 0;
  ctxByEl.forEach(c => { n += c.ranges.length; });
  document.getElementById("adopt-line").textContent =
    n > 0 ? `選んだ部分：${n}か所` : "選んだ部分は、まだありません。";
}

/* 選んだ部分をハイライトし、下にチップで一覧表示する。他人の文字列なので textContent のみ */
function paint(ctx){
  const { chars, el, chipsEl, block } = ctx;
  const ranges = [...ctx.ranges].sort((a,b) => a.s - b.s);
  el.replaceChildren();
  let cur = 0;
  ranges.forEach(r => {
    if(r.s > cur) el.append(chars.slice(cur, r.s).join(""));
    const m = document.createElement("mark");
    m.textContent = chars.slice(r.s, r.e).join("");
    el.appendChild(m);
    cur = r.e;
  });
  if(cur < chars.length) el.append(chars.slice(cur).join(""));

  chipsEl.replaceChildren();
  ranges.forEach(r => {
    const chip = document.createElement("span");
    chip.className = "chip";
    const t = document.createElement("span");
    t.textContent = chars.slice(r.s, r.e).join("");
    const x = document.createElement("button");
    x.type = "button";
    x.textContent = "×";
    x.setAttribute("aria-label", "この部分の選択を取り消す");
    x.disabled = !session.adoptionOpen;
    x.addEventListener("click", () => {
      save(ctx, ctx.ranges.filter(q => q !== r && !(q.s === r.s && q.e === r.e)));
    });
    chip.append(t, x);
    chipsEl.appendChild(chip);
  });
  block.classList.toggle("adopted", ranges.length > 0);
  updateAdoptCount();
}

function lockEditing(){
  session.adoptionOpen = false;
  hideBar();
  ctxByEl.forEach(paint);
  showAdoptNote(MESSAGES.adoption_closed);
}

/* その発言の選択範囲を、まとめて保存する（サーバー側で本人確認・範囲チェックを行う） */
async function save(ctx, ranges){
  adoptNote.style.display = "none";
  try{
    const { data, error } = await supabaseClient.rpc("set_my_selection", {
      p_number: session.number,
      p_code: session.code,
      p_response_key: ctx.key,
      p_field: ctx.field,
      p_ranges: ranges.map(r => ({ s:r.s, e:r.e }))
    });
    if(error || !data || !data.ok){
      console.error(error);
      if(data && data.reason === "adoption_closed"){ lockEditing(); return; }
      showAdoptNote(MESSAGES[data && data.reason] || MESSAGES.error);
      return;
    }
    ctx.ranges = (data.ranges || []).map(r => ({ s:r.s, e:r.e }));
    paint(ctx);
  }catch(err){
    console.error(err);
    showAdoptNote(MESSAGES.error);
  }
}

/* ---------- 文字の範囲選択 ---------- */

function hideBar(){ bar.style.display = "none"; pending = null; }

function updateBar(){
  const sel = window.getSelection();
  if(!session.adoptionOpen || !sel || sel.rangeCount === 0 || sel.isCollapsed){
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideBar, 400);   // ボタンを押す間は、少しだけ残す
    return;
  }
  const range = sel.getRangeAt(0);
  const node = range.commonAncestorContainer;
  const base = node.nodeType === 1 ? node : node.parentElement;
  const el = base && base.closest(".answer-a");
  const ctx = el && ctxByEl.get(el);
  if(!ctx){ hideBar(); return; }

  clearTimeout(hideTimer);
  /* 発言の先頭からの文字数（サロゲートペアも1文字として数える） */
  const pre = document.createRange();
  pre.selectNodeContents(el);
  pre.setEnd(range.startContainer, range.startOffset);
  let s = Array.from(pre.toString()).length;
  let e = s + Array.from(range.toString()).length;
  const ch = ctx.chars;
  while(s < e && /\s/.test(ch[s])) s++;
  while(e > s && /\s/.test(ch[e-1])) e--;
  e = Math.min(e, ch.length);
  if(e <= s){ hideBar(); return; }

  pending = { ctx, s, e };
  const phrase = ch.slice(s, e).join("").replace(/\s+/g, " ");
  barText.textContent = `「${phrase}」`;
  bar.style.display = "block";
}

let armed = null;
barAdopt.addEventListener("pointerdown", () => { armed = pending; });
barAdopt.addEventListener("click", () => {
  const p = armed || pending;
  armed = null;
  if(!p) return;
  const { ctx } = p;
  /* 重なる既存の選択とは、ひとつにまとめる */
  let s = p.s, e = p.e;
  const keep = [];
  ctx.ranges.forEach(r => {
    if(r.s < e && r.e > s){ s = Math.min(s, r.s); e = Math.max(e, r.e); }
    else keep.push(r);
  });
  keep.push({ s, e });
  window.getSelection().removeAllRanges();
  hideBar();
  save(ctx, keep);
});
document.addEventListener("selectionchange", updateBar);

/* ---------- 回答の表示 ---------- */

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function renderResults(responses, adoptionOpen, selections){
  const list = document.getElementById("answer-list");
  list.replaceChildren();
  ctxByEl.clear();
  hideBar();
  adoptNote.style.display = "none";
  session.adoptionOpen = adoptionOpen;

  const countLine = document.getElementById("count-line");
  countLine.replaceChildren();
  const strong = document.createElement("b");
  strong.textContent = responses.length;
  countLine.append(strong, "件の回答が届いています");

  if(responses.length === 0){
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "まだ回答は届いていません。";
    list.appendChild(empty);
  }
  if(!adoptionOpen) showAdoptNote(MESSAGES.adoption_closed);

  /* 誰が書いたか推測されにくいよう、質問ごとに分けて、順番もばらばらにして表示する */
  QUESTIONS.forEach(q => {
    const items = [];
    responses.forEach(item => {
      const answers = item.answers || {};
      const value = typeof answers[q.id] === "string" ? answers[q.id] : "";
      if(value.trim()) items.push({ key: item.key, value });
    });
    if(items.length === 0) return;
    shuffle(items);

    const section = document.createElement("section");
    const title = document.createElement("h2");
    title.className = "section-title";
    title.textContent = q.label;
    const card = document.createElement("div");
    card.className = "card";
    section.append(title, card);

    items.forEach(it => {
      const block = document.createElement("div");
      block.className = "answer-block";
      const answer = document.createElement("p");
      answer.className = "answer-a";
      const chips = document.createElement("div");
      chips.className = "chips";
      block.append(answer, chips);
      card.appendChild(block);

      const ctx = {
        key: it.key, field: q.id, chars: Array.from(it.value),
        el: answer, chipsEl: chips, block,
        ranges: selections
          .filter(r => String(r.key) === String(it.key) && r.field === q.id)
          .map(r => ({ s:r.s, e:r.e }))
      };
      ctxByEl.set(answer, ctx);
      paint(ctx);
    });
    list.appendChild(section);
  });
  updateAdoptCount();
}

async function showMyResponses(){
  hideNotice();
  const number = Number(ownNumber.value);
  const code = ownCode.value.trim();
  if(!number){ showNotice("出席番号を選んでください。"); return; }
  if(!code){ showNotice("個別コードを入力してください。"); return; }

  showButton.disabled = true;
  try{
    const { data, error } = await supabaseClient.rpc("get_my_responses", { p_number:number, p_code:code });
    if(error || !data){ console.error(error); showNotice(MESSAGES.error); return; }
    if(!data.ok){ showNotice(MESSAGES[data.reason] || MESSAGES.error); return; }

    const sel = await supabaseClient.rpc("get_my_selections", { p_number:number, p_code:code });
    if(sel.error || !sel.data || !sel.data.ok){ console.error(sel.error); showNotice(MESSAGES.error); return; }

    session.number = number;
    session.code = code;
    renderResults(
      Array.isArray(data.responses) ? data.responses : [],
      data.adoption_open !== false,
      Array.isArray(sel.data.selections) ? sel.data.selections : []
    );
    ownCode.value = "";
    document.getElementById("auth-card").style.display = "none";
    document.getElementById("results").style.display = "block";
    window.scrollTo({ top:0 });
  }finally{
    showButton.disabled = false;
  }
}

/* 閉じる：表示した回答を画面から消して、入力画面に戻る */
function closeResults(){
  session.number = null;
  session.code = null;
  ctxByEl.clear();
  hideBar();
  document.getElementById("answer-list").replaceChildren();
  document.getElementById("results").style.display = "none";
  document.getElementById("auth-card").style.display = "block";
}

showButton.addEventListener("click", showMyResponses);
document.getElementById("close-button").addEventListener("click", closeResults);
ownCode.addEventListener("keydown", e => {
  if(e.key === "Enter"){ e.preventDefault(); showMyResponses(); }
});

loadNumbers();
</script>
</body>
</html>
