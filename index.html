<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>あなたへの回答｜クラス印象アンケート</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>

:root{
  --paper:#F6F1E6;
  --paper-line:#DCD2BB;
  --ink:#23282E;
  --ink-soft:#5B5647;
  --stamp:#B23A2E;
  --stamp-soft:#E9D9CE;
  --ok:#55684A;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Zen Kaku Gothic New', sans-serif;
  line-height:1.7;
  min-height:100vh;
}

.wrap{
  max-width:560px;
  margin:0 auto;
  padding:40px 20px 80px;
}

header.page-head{
  border-bottom:1px solid var(--paper-line);
  padding-bottom:20px;
  margin-bottom:32px;
}

h1{
  font-family:'Shippori Mincho', serif;
  font-weight:700;
  font-size:26px;
  margin:0 0 10px;
  letter-spacing:.02em;
}

.lead{
  color:var(--ink-soft);
  font-size:14.5px;
  margin:0;
}

.card{
  background:#fff;
  border:1px solid var(--paper-line);
  border-radius:2px;
  padding:26px 22px;
  margin-bottom:22px;
}

label{
  display:block;
  font-size:13.5px;
  font-weight:700;
  margin:18px 0 6px;
}

label:first-of-type{
  margin-top:0;
}

select,
input[type=text]{
  width:100%;
  font-family:inherit;
  color:var(--ink);
  background:var(--paper);
  border:1px solid var(--paper-line);
  border-radius:2px;
}

select{
  font-size:22px;
  font-weight:700;
  padding:12px 14px;
}

input[type=text]{
  font-size:20px;
  letter-spacing:.18em;
  text-transform:uppercase;
  padding:12px 14px;
}

select:focus-visible,
input:focus-visible,
button:focus-visible{
  outline:2px solid var(--ink);
  outline-offset:2px;
}

button{
  font-family:inherit;
  font-size:15px;
  font-weight:700;
  color:#fff;
  background:var(--stamp);
  border:0;
  border-radius:2px;
  padding:13px 26px;
  margin-top:22px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:default;
}

button.quiet{
  color:var(--ink-soft);
  background:transparent;
  border:1px solid var(--paper-line);
  margin-top:0;
}

.notice{
  display:none;
  margin-top:16px;
  padding:12px 14px;
  font-size:14px;
  color:var(--stamp);
  background:var(--stamp-soft);
  border-radius:2px;
}

.hint{
  margin:14px 0 0;
  font-size:12.5px;
  color:var(--ink-soft);
}

.summary{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:14px;
  margin-bottom:22px;
}

.summary p{
  margin:0;
  font-family:'Shippori Mincho', serif;
  font-weight:700;
  font-size:20px;
}

.summary p b{
  color:var(--stamp);
  font-size:30px;
  margin:0 2px;
}

.answer-q{
  font-size:12.5px;
  font-weight:700;
  color:var(--ink-soft);
  margin:18px 0 4px;
}

.answer-q:first-child{
  margin-top:0;
}

.answer-a{
  margin:0;
  font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.empty{
  text-align:center;
  color:var(--ink-soft);
  font-size:14px;
  padding:40px 0;
}

.answer-block{
  padding-left:12px;
  margin-top:20px;
  border-left:3px solid transparent;
}

.answer-block:first-child{
  margin-top:0;
}

.answer-block.adopted{
  border-left-color:var(--ok);
}

.answer-block .answer-q{
  margin:0 0 4px;
}

button.adopt{
  margin-top:10px;
  padding:7px 14px;
  font-size:13px;
  color:var(--ok);
  background:transparent;
  border:1px solid var(--ok);
}

button.adopt[aria-pressed="true"]{
  color:#fff;
  background:var(--ok);
}

.adopted-mark{
  display:inline-block;
  margin-top:10px;
  font-size:13px;
  font-weight:700;
  color:var(--ok);
}

.caution{
  margin:0 0 18px;
  padding:14px 16px;
  font-size:13px;
  color:var(--ink-soft);
  background:#fff;
  border:1px solid var(--paper-line);
  border-left:3px solid var(--ink-soft);
  border-radius:2px;
}

.caution p{
  margin:0;
}

.caution p + p{
  margin-top:8px;
}

.caution b{
  color:var(--ink);
}

#adopt-line{
  margin:-8px 0 18px;
}

#adopt-note{
  margin:0 0 18px;
}

#results{
  display:none;
}

@media (prefers-reduced-motion: no-preference){

  #results .card{
    animation:rise .35s ease both;
  }

}

@keyframes rise{

  from{
    opacity:0;
    transform:translateY(6px);
  }

  to{
    opacity:1;
    transform:none;
  }

}

</style>
</head>

<body>

<div class="wrap">

  <header class="page-head">

    <h1>あなたへの回答</h1>

    <p class="lead">
      あなたについて書かれた回答を読むことができます。
      誰が書いたかは表示されません。
    </p>

  </header>


  <!-- 本人確認 -->

  <div class="card" id="auth-card">

    <label for="own-number">
      あなたの出席番号
    </label>

    <select id="own-number">
      <option value="" disabled selected>選択してください</option>
    </select>

    <label for="own-code">
      個別コード
    </label>

    <input
      type="text"
      id="own-code"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      maxlength="12"
    >

    <button type="button" id="show-button">
      回答を見る
    </button>

    <div class="notice" id="notice" role="alert"></div>

    <p class="hint">
      個別コードは先生から1人ずつ渡されます。
      他の人に見せないでください。
    </p>

  </div>


  <!-- 回答一覧 -->

  <div id="results">

    <div class="summary">

      <p id="count-line"></p>

      <button type="button" class="quiet" id="close-button">
        閉じる
      </button>

    </div>

    <div class="caution">

      <p>
        この画面の目的は、あなたについて書かれた内容を
        知ってもらうことです。
      </p>

      <p>
        クラスページに載せたい発言があれば、希望を選ぶこともできます（任意）。
        <b>ただし、文字数の関係上、意見を反映できず、
        委員が独断でクラスページに載せる内容を決定する可能性が大いにあります。</b>
      </p>

    </div>

    <p class="hint" id="adopt-line"></p>

    <div class="notice" id="adopt-note" role="alert"></div>

    <div id="answer-list"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://tqvemvvimtsnrmohelnm.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_TRfm7gxQ7Sdh_8CX85smDw_TG4akfdj";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* index.html の QUESTIONS と同じ内容にしてください */

const QUESTIONS = [

  { id:"impression", label:"この人の印象を教えてください" },
  { id:"goodpoint",  label:"良いところ・すごいと思うところ" },
  { id:"message",    label:"一言メッセージ" }

];


const MESSAGES = {

  not_released:
    "回答の公開はまだ始まっていません。公開されるまでお待ちください。",

  locked:
    "入力の失敗が続いたため、一時的に利用できません。15分ほど待ってからやり直してください。",

  invalid:
    "出席番号か個別コードが違います。もう一度確かめてください。",

  adoption_closed:
    "掲載希望の受付は締め切られました。",

  not_found:
    "この発言が見つかりませんでした。ページを開き直してください。",

  error:
    "読み込みに失敗しました。時間をおいて、もう一度お試しください。"

};


const ownNumber =
  document.getElementById("own-number");

const ownCode =
  document.getElementById("own-code");

const showButton =
  document.getElementById("show-button");

const notice =
  document.getElementById("notice");


function showNotice(text){

  notice.textContent = text;

  notice.style.display = "block";

}


function hideNotice(){

  notice.style.display = "none";

}


/* 出席番号の読み込み（名前は取得しない） */

async function loadNumbers(){

  const { data, error } =
    await supabaseClient.rpc(
      "get_roster_numbers"
    );

  if(error || !Array.isArray(data)){

    showNotice(MESSAGES.error);

    return;

  }

  data.forEach(r => {

    const option =
      document.createElement("option");

    option.value = r.number;

    option.textContent = `${r.number}番`;

    ownNumber.appendChild(option);

  });

}


/* 本人確認に使った番号とコード。画面を閉じるまでメモリ上にだけ置く */

const session = {
  number:null,
  code:null
};


const adoptNote =
  document.getElementById("adopt-note");


function updateAdoptCount(){

  const count =
    document.querySelectorAll(
      "#answer-list .answer-block.adopted"
    ).length;

  document.getElementById("adopt-line").textContent =
    count > 0
      ? `掲載を希望する発言：${count}件`
      : "掲載を希望する発言は、選ばれていません。";

}


function setAdopted(button, block, adopted){

  block.classList.toggle("adopted", adopted);

  button.setAttribute("aria-pressed", String(adopted));

  button.textContent =
    adopted ? "掲載を希望中（押すと取り消し）" : "掲載を希望する";

}


async function toggleAdoption(button, block, key, field){

  const next =
    button.getAttribute("aria-pressed") !== "true";

  adoptNote.style.display = "none";

  button.disabled = true;

  try{

    const { data, error } =
      await supabaseClient.rpc(
        "set_my_adoption",
        {
          p_number: session.number,
          p_code: session.code,
          p_response_key: key,
          p_field: field,
          p_adopted: next
        }
      );

    if(error || !data || !data.ok){

      console.error(error);

      adoptNote.textContent =
        MESSAGES[data && data.reason] || MESSAGES.error;

      adoptNote.style.display = "block";

      return;

    }

    setAdopted(button, block, next);

    updateAdoptCount();

  }finally{

    button.disabled = false;

  }

}


/* 回答の表示。他人が書いた文字列なので、必ず textContent で入れる */

function renderResults(responses, adoptionOpen){

  const list =
    document.getElementById("answer-list");

  list.replaceChildren();

  adoptNote.style.display = "none";

  const countLine =
    document.getElementById("count-line");

  countLine.replaceChildren();

  const strong =
    document.createElement("b");

  strong.textContent = responses.length;

  countLine.append(strong, "件の回答が届いています");


  if(responses.length === 0){

    const empty =
      document.createElement("p");

    empty.className = "empty";

    empty.textContent =
      "まだ回答は届いていません。";

    list.appendChild(empty);

  }


  if(!adoptionOpen){

    adoptNote.textContent = MESSAGES.adoption_closed;

    adoptNote.style.display = "block";

  }


  responses.forEach(item => {

    const answers =
      item.answers || {};

    const adoptedFields =
      Array.isArray(item.adopted) ? item.adopted : [];

    const card =
      document.createElement("div");

    card.className = "card";

    QUESTIONS.forEach(q => {

      const value =
        typeof answers[q.id] === "string"
          ? answers[q.id].trim()
          : "";

      if(!value){

        return;

      }

      const isAdopted =
        adoptedFields.includes(q.id);

      const block =
        document.createElement("div");

      block.className = "answer-block";

      const question =
        document.createElement("p");

      question.className = "answer-q";

      question.textContent = q.label;

      const answer =
        document.createElement("p");

      answer.className = "answer-a";

      answer.textContent = value;

      block.append(question, answer);

      if(adoptionOpen){

        const button =
          document.createElement("button");

        button.type = "button";

        button.className = "adopt";

        setAdopted(button, block, isAdopted);

        button.addEventListener("click", () => {

          toggleAdoption(button, block, item.key, q.id);

        });

        block.appendChild(button);

      }else if(isAdopted){

        block.classList.add("adopted");

        const mark =
          document.createElement("span");

        mark.className = "adopted-mark";

        mark.textContent = "掲載を希望";

        block.appendChild(mark);

      }

      card.appendChild(block);

    });

    if(card.childElementCount > 0){

      list.appendChild(card);

    }

  });

  updateAdoptCount();

}


async function showMyResponses(){

  hideNotice();

  const number =
    Number(ownNumber.value);

  const code =
    ownCode.value.trim();

  if(!number){

    showNotice("出席番号を選んでください。");

    return;

  }

  if(!code){

    showNotice("個別コードを入力してください。");

    return;

  }

  showButton.disabled = true;

  try{

    const { data, error } =
      await supabaseClient.rpc(
        "get_my_responses",
        {
          p_number: number,
          p_code: code
        }
      );

    if(error || !data){

      console.error(error);

      showNotice(MESSAGES.error);

      return;

    }

    if(!data.ok){

      showNotice(
        MESSAGES[data.reason] || MESSAGES.error
      );

      return;

    }

    session.number = number;

    session.code = code;

    renderResults(
      Array.isArray(data.responses)
        ? data.responses
        : [],
      data.adoption_open !== false
    );

    ownCode.value = "";

    document.getElementById("auth-card").style.display = "none";

    document.getElementById("results").style.display = "block";

    window.scrollTo({ top: 0 });

  }finally{

    showButton.disabled = false;

  }

}


/* 閉じる：表示した回答を画面から消して、入力画面に戻る */

function closeResults(){

  session.number = null;

  session.code = null;

  document.getElementById("answer-list").replaceChildren();

  document.getElementById("results").style.display = "none";

  document.getElementById("auth-card").style.display = "block";

}


showButton.addEventListener("click", showMyResponses);

document
  .getElementById("close-button")
  .addEventListener("click", closeResults);

ownCode.addEventListener("keydown", (e) => {

  if(e.key === "Enter"){

    e.preventDefault();

    showMyResponses();

  }

});

loadNumbers();

</script>

</body>
</html>
